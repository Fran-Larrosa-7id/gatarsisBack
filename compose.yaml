services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-gatarsis}
      POSTGRES_USER: ${DATABASE_USER:-gatarsis}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-gatarsis_local_password}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
